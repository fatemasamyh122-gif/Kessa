<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مكتبة الحكايات الذكية 📚✨</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Cairo', sans-serif; background-color: #FFFDF0; }
    .shelf { background: #E2A053; border-bottom: 12px solid #B87333; border-radius: 8px; }
  </style>
</head>
<body class="p-4 md:p-8">

  <!-- Header -->
  <header class="text-center mb-8">
    <h1 class="text-4xl md:text-5xl font-black text-amber-800 drop-shadow">مكتبتي الذكية 🦁📖</h1>
    <p class="text-amber-700 text-lg mt-2">اقرأ، اكتشف، وفكر في القرارات!</p>
  </header>

  <main class="max-w-5xl mx-auto space-y-12" id="app">
    <!-- Shelf 1: In Progress -->
    <section>
      <h2 class="text-2xl font-bold text-orange-600 mb-3 flex items-center gap-2">
        <span>⏳</span> جاري القراءة
      </h2>
      <div id="in-progress-shelf" class="shelf p-4 min-h-[220px] flex gap-4 overflow-x-auto items-end"></div>
    </section>

    <!-- Shelf 2: Book Pool -->
    <section>
      <h2 class="text-2xl font-bold text-amber-800 mb-3 flex items-center gap-2">
        <span>📚</span> بركة القصص المتاحة
      </h2>
      <div id="pool-shelf" class="shelf p-4 min-h-[220px] flex gap-4 overflow-x-auto items-end"></div>
    </section>

    <!-- Shelf 3: Finished -->
    <section>
      <h2 class="text-2xl font-bold text-green-700 mb-3 flex items-center gap-2">
        <span>🎉</span> القصص المكتملة
      </h2>
      <div id="finished-shelf" class="shelf p-4 min-h-[220px] flex gap-4 overflow-x-auto items-end"></div>
    </section>
  </main>

  <!-- Interactive Reader Modal -->
  <div id="reader-modal" class="fixed inset-0 bg-black/80 hidden z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl max-w-2xl w-full p-6 relative max-h-[90vh] overflow-y-auto">
      <button onclick="closeReader()" class="absolute top-4 left-4 bg-red-500 text-white rounded-full w-10 h-10 font-bold text-xl">✕</button>
      <div id="reader-content" class="text-center space-y-6"></div>
    </div>
  </div>

  <script>
    const STORY_FOLDERS = ['sick_lion'];
    let userProgress = JSON.parse(localStorage.getItem('story_progress')) || {};

    let currentStory = null;
    let currentSceneIndex = 0;
    let isAlternateMode = false;
    let selectedCharacterData = null;

    async function loadStories() {
      const stories = [];
      for (const folder of STORY_FOLDERS) {
        try {
          // Change this line in loadStories():
          const res = await fetch(`stories/${folder}/story_data.json?v=${Date.now()}`);
          const data = await res.json();
          data.folder = folder;
          stories.push(data);
        } catch(e) {
          console.error("Could not load story:", folder, e);
        }
      }
      renderShelves(stories);
    }

    function renderShelves(stories) {
      const poolShelf = document.getElementById('pool-shelf');
      const inProgressShelf = document.getElementById('in-progress-shelf');
      const finishedShelf = document.getElementById('finished-shelf');

      poolShelf.innerHTML = '';
      inProgressShelf.innerHTML = '';
      finishedShelf.innerHTML = '';

      stories.forEach(story => {
        const status = userProgress[story.story_id]?.status || 'pool';
        const card = createStoryCard(story);

        if (status === 'in_progress') inProgressShelf.appendChild(card);
        else if (status === 'finished') finishedShelf.appendChild(card);
        else poolShelf.appendChild(card);
      });
    }

    function createStoryCard(story) {
      const el = document.createElement('div');
      el.className = "bg-white p-3 rounded-2xl shadow-md w-40 flex-shrink-0 cursor-pointer transform hover:-translate-y-2 transition";
      el.onclick = () => startStory(story);
      el.innerHTML = `
        <img src="stories/${story.folder}/${story.cover_image}" class="w-full h-44 object-contain bg-amber-50 rounded-xl mb-2" onerror="this.src='https://via.placeholder.com/150?text=غلاف+القصة'">
        <h3 class="font-bold text-sm text-center text-gray-800 line-clamp-1">${story.title_ar}</h3>
      `;
      return el;
    }

    function startStory(story) {
      currentStory = story;
      currentSceneIndex = 0;
      isAlternateMode = false;
      
      if (!userProgress[story.story_id] || userProgress[story.story_id].status !== 'finished') {
        userProgress[story.story_id] = { status: 'in_progress' };
        localStorage.setItem('story_progress', JSON.stringify(userProgress));
      }

      document.getElementById('reader-modal').classList.remove('hidden');
      renderScene();
    }

    function renderScene() {
  const container = document.getElementById('reader-content');
  const scenes = isAlternateMode ? currentStory.time_travel.alternate_story : currentStory.main_story;
  const scene = scenes[currentSceneIndex];

  if (currentSceneIndex < scenes.length) {
    // إجبار المتصفح على قراءة الصورة الصحيحة بدون كاش
    const imagePath = `stories/${currentStory.folder}/${scene.image_filename}?v=${Date.now()}`;
    
    container.innerHTML = `
      <img src="${imagePath}" class="max-h-[50vh] w-auto mx-auto object-contain rounded-2xl shadow-sm" onerror="this.src='https://via.placeholder.com/500x300?text=صورة+غير+موجودة'">
      <p class="text-xl font-bold text-gray-800 leading-relaxed mt-4">${scene.text_ar}</p>
      <div class="flex justify-between mt-6">
        ${currentSceneIndex > 0 ? `<button onclick="prevScene()" class="bg-gray-300 px-6 py-2 rounded-xl font-bold">السابق</button>` : `<div></div>`}
        <button onclick="nextScene()" class="bg-amber-500 text-white px-8 py-2 rounded-xl font-bold text-lg shadow-lg">التالي ➔</button>
      </div>
    `;
  } else if (!isAlternateMode) {
    container.innerHTML = `
      <div class="text-center space-y-4 py-6">
        <h2 class="text-3xl font-black text-amber-800">🎉 النهاية!</h2>
        <p class="text-xl text-gray-700">${currentStory.time_travel.question_ar}</p>
        <div class="flex flex-col gap-3 max-w-xs mx-auto pt-4">
          <button onclick="startTimeTravel()" class="bg-purple-600 text-white p-4 rounded-2xl font-bold text-lg shadow-lg hover:bg-purple-700">⏳ نعم! ارجع بالزمن وغير القرار</button>
          <button onclick="startActivity()" class="bg-green-600 text-white p-4 rounded-2xl font-bold text-lg shadow-lg hover:bg-green-700">🧩 الانتقال للنشاط التفاعلي</button>
        </div>
      </div>
    `;
  } else {
    container.innerHTML = `
      <div class="text-center space-y-4 py-6">
        <h2 class="text-2xl font-bold text-purple-800">✨ مسار رائع!</h2>
        <p class="text-lg text-gray-600">أرأيت كيف تغيرت الأحداث عندما تغير القرار؟</p>
        <button onclick="startActivity()" class="bg-green-600 text-white px-8 py-3 rounded-2xl font-bold text-lg shadow-lg">الانتقال للنشاط التفاعلي 🧩</button>
      </div>
    `;
  }
}

    function nextScene() { currentSceneIndex++; renderScene(); }
    function prevScene() { currentSceneIndex--; renderScene(); }
    function startTimeTravel() { isAlternateMode = true; currentSceneIndex = 0; renderScene(); }

    function startActivity() {
      const container = document.getElementById('reader-content');
      const act = currentStory.post_activity;
      // التسلسل 1: نبدأ دائماً بسؤال الذكاء
      renderQuizActivity(container, act);
    }

    // --- 1. شاشة سؤال الذكاء ---
    function renderQuizActivity(container, act) {
      const content = act.content || {};
      let optionsHTML = '';
      if (content.options) {
        optionsHTML = content.options.map((opt, i) => `
          <button onclick="checkAnswer('${opt.replace(/'/g, "\\'")}', '${(content.correct_answer || '').replace(/'/g, "\\'")}')" 
                  class="bg-amber-100 hover:bg-amber-200 text-amber-900 border-2 border-amber-300 p-4 rounded-2xl font-bold text-lg text-right w-full transition flex items-center gap-3">
            <span class="bg-amber-500 text-white w-8 h-8 rounded-full flex items-center justify-center text-sm flex-shrink-0">${i + 1}</span>
            ${opt}
          </button>
        `).join('');
      }

      container.innerHTML = `
        <div class="space-y-6">
          <div class="inline-block bg-purple-100 text-purple-800 px-4 py-1 rounded-full font-bold text-sm">🧩 أولاً: سؤال الذكاء</div>
          <h2 class="text-2xl font-black text-amber-900">${act.title_ar}</h2>
          <p class="text-gray-600 font-semibold">${act.instructions_ar}</p>

          ${content.question_1 ? `<div class="bg-amber-50 p-4 rounded-2xl border border-amber-200 text-xl font-bold text-amber-900">${content.question_1}</div>` : ''}

          <div class="flex flex-col gap-3 pt-2">
            ${optionsHTML}
          </div>

          <div id="quiz-feedback" class="hidden text-xl font-bold p-4 rounded-2xl"></div>

          <!-- زر الانتقال للعبة التلوين يظهر فقط بعد الإجابة الصحيحة -->
          <button id="next-to-paint-btn" onclick="startPaintActivity()" class="hidden bg-blue-600 hover:bg-blue-700 text-white px-8 py-3 rounded-2xl font-bold text-lg shadow-lg mx-auto w-full md:w-auto transition transform hover:scale-105">
            الانتقال للعبة التلوين السحرية 🎨 ➔
          </button>
        </div>
      `;
    }

    function checkAnswer(selected, correct) {
      const feedback = document.getElementById('quiz-feedback');
      const nextBtn = document.getElementById('next-to-paint-btn');
      
      feedback.classList.remove('hidden', 'bg-red-100', 'text-red-700', 'bg-green-100', 'text-green-700');

      if (selected === correct) {
        feedback.classList.add('bg-green-100', 'text-green-700');
        feedback.innerHTML = '✨ إجابة أسطورية! أنت ذكي جداً! لقد فتحت اللعبة السرية.';
        nextBtn.classList.remove('hidden'); // إظهار الزر
      } else {
        feedback.classList.add('bg-red-100', 'text-red-700');
        feedback.innerHTML = '🤔 فكر مرة ثانية!';
      }
    }

    // --- 2. شاشة التلوين بالأرقام ---
    function startPaintActivity() {
      const container = document.getElementById('reader-content');
      const act = currentStory.post_activity;
      renderPaintByNumber(container, act);
    }

    function renderPaintByNumber(container, act) {
      const charsList = (act.content && act.content.characters && act.content.characters.length > 0)
        ? act.content.characters
        : [];

      // اختيار شخصية عشوائية وحفظ بياناتها بالكامل
      selectedCharacterData = charsList[Math.floor(Math.random() * charsList.length)];
      const imagePath = `stories/${currentStory.folder}/${selectedCharacterData.image}?v=${Date.now()}`;

      const colors = [
        { num: 1, name: 'أصفر', bg: 'bg-yellow-400', border: 'border-yellow-600', text: 'text-yellow-900' },
        { num: 2, name: 'أزرق', bg: 'bg-blue-500', border: 'border-blue-700', text: 'text-white' },
        { num: 3, name: 'أحمر', bg: 'bg-red-500', border: 'border-red-700', text: 'text-white' },
        { num: 4, name: 'أخضر', bg: 'bg-green-500', border: 'border-green-700', text: 'text-white' }
      ];

      const gridPattern = [
        1, 2, 3, 4,
        3, 4, 1, 2,
        2, 1, 4, 3,
        4, 3, 2, 1
      ];

      activeColorNumber = 1;
      remainingCells = 16;
      

      let gridCellsHTML = '';
      gridPattern.forEach((num, index) => {
        gridCellsHTML += `
          <div id="cell-${index}" 
               onclick="colorCell(${index}, ${num})" 
               class="border border-gray-300 bg-amber-100 flex items-center justify-center cursor-pointer transition transform hover:scale-95 select-none opacity-95">
            <span class="w-8 h-8 rounded-full bg-white/80 text-gray-800 font-black flex items-center justify-center shadow text-sm">${num}</span>
          </div>
        `;
      });

      let paletteHTML = colors.map(c => `
        <button id="color-btn-${c.num}" 
                onclick="selectColor(${c.num})" 
                class="palette-btn flex-1 p-3 rounded-2xl font-black text-sm flex flex-col items-center gap-1 border-4 transition ${c.bg} ${c.text} ${c.num === 1 ? 'border-black scale-105 shadow-lg' : 'border-transparent opacity-80'}">
          <span>اللون ${c.num}</span>
        </button>
      `).join('');

      container.innerHTML = `
        <div class="space-y-4">
          <div class="inline-block bg-purple-100 text-purple-800 px-4 py-1 rounded-full font-bold text-sm">🎨 ثانياً: لعبة كشف الشخصية</div>
          <p class="text-gray-600 text-sm font-semibold">اختر اللون من الأسفل واضغط على الرقم المماثل لتلوين الخانات المقلوبة واكشف الشخصية السحرية!</p>

          <div class="relative max-w-xs mx-auto overflow-hidden rounded-3xl border-4 border-amber-400 shadow-xl bg-gray-100">
            <div id="paint-canvas-wrapper" class="flipped-canvas relative w-64 h-64 mx-auto">
              <img src="${imagePath}" class="w-full h-full object-cover">
              <div id="paint-grid" class="absolute inset-0 grid grid-cols-4 grid-rows-4">
                ${gridCellsHTML}
              </div>
            </div>
          </div>

          <div class="max-w-xs mx-auto space-y-2">
            <div class="flex gap-2">
              ${paletteHTML}
            </div>
          </div>

          <div id="paint-feedback" class="text-lg font-bold text-amber-800 h-6">اختر اللون وابدأ التلوين! 🖌️</div>

          <!-- الزر الآن ينقلك لسؤال الذاكرة وليس لبطاقة الحكمة مباشرة -->
          <button id="finish-btn" onclick="renderCharacterQuiz()" class="hidden bg-blue-600 hover:bg-blue-700 text-white px-8 py-3 rounded-2xl font-bold text-lg shadow-lg mx-auto transition transform hover:scale-105">
            اختبار الذاكرة 🧠 ➔
          </button>
        </div>
      `;
    }
    function selectColor(colorNum) {
      activeColorNumber = colorNum;
      document.querySelectorAll('.palette-btn').forEach(btn => {
        btn.classList.remove('border-black', 'scale-105', 'shadow-lg');
        btn.classList.add('border-transparent', 'opacity-80');
      });
      const selectedBtn = document.getElementById(`color-btn-${colorNum}`);
      selectedBtn.classList.remove('border-transparent', 'opacity-80');
      selectedBtn.classList.add('border-black', 'scale-105', 'shadow-lg');
    }
    function colorCell(cellIndex, targetNum) {
      const cell = document.getElementById(`cell-${cellIndex}`);
      const feedback = document.getElementById('paint-feedback');

      if (cell.dataset.colored === "true") return;

      if (activeColorNumber === targetNum) {
        cell.dataset.colored = "true";
        cell.style.opacity = "0"; 
        cell.style.pointerEvents = "none";
        remainingCells--;

        feedback.innerHTML = "✨ ممتاز! كمل التلوين!";

        if (remainingCells === 0) {
          const canvas = document.getElementById('paint-canvas-wrapper');
          canvas.classList.remove('flipped-canvas');
          canvas.classList.add('revealed-canvas');

          feedback.innerHTML = "🎉 ياه! كشفت الشخصية السرية بنجاح!";
          document.getElementById('finish-btn').classList.remove('hidden');
        }
      } else {
        feedback.innerHTML = "🤔 اختار اللون المناسب للرقم!";
      }
    }

    // --- 3. شاشة سؤال الذاكرة (الجديدة) ---
    function renderCharacterQuiz() {
      const container = document.getElementById('reader-content');
      const allCharacters = currentStory.post_activity.content.characters || [];
      
      // استخراج جميع الأدوار وخلطها لتكون هي الاختيارات
      let allRoles = allCharacters.map(c => c.role_ar);
      allRoles = allRoles.sort(() => Math.random() - 0.5); // خلط عشوائي للاختيارات

      const correctRole = selectedCharacterData.role_ar;
      const imagePath = `stories/${currentStory.folder}/${selectedCharacterData.image}?v=${Date.now()}`;

      let optionsHTML = allRoles.map((role, i) => `
        <button onclick="checkCharacterAnswer('${role.replace(/'/g, "\\'")}', '${correctRole.replace(/'/g, "\\'")}')" 
                class="bg-indigo-50 hover:bg-indigo-100 text-indigo-900 border-2 border-indigo-200 p-4 rounded-2xl font-bold text-lg text-right w-full transition flex items-center gap-3">
          <span class="bg-indigo-400 text-white w-8 h-8 rounded-full flex items-center justify-center text-sm flex-shrink-0">${i + 1}</span>
          ${role}
        </button>
      `).join('');

      container.innerHTML = `
        <div class="space-y-6">
          <div class="inline-block bg-purple-100 text-purple-800 px-4 py-1 rounded-full font-bold text-sm">🤔 ثالثاً: سؤال الذاكرة</div>
          <h2 class="text-2xl font-black text-amber-900">هل تتذكر ماذا فعلت هذه الشخصية في القصة؟</h2>
          
          <img src="${imagePath}" class="w-40 h-40 object-cover mx-auto rounded-3xl border-4 border-amber-400 shadow-lg">
          
          <div class="flex flex-col gap-3 pt-2">
            ${optionsHTML}
          </div>

          <div id="char-quiz-feedback" class="hidden text-xl font-bold p-4 rounded-2xl"></div>

          <button id="next-to-wisdom-btn" onclick="showWisdomKeepsake()" class="hidden bg-green-600 hover:bg-green-700 text-white px-8 py-3 rounded-2xl font-bold text-lg shadow-lg mx-auto w-full md:w-auto transition transform hover:scale-105">
            الحصول على بطاقة الحكمة 🎉 ➔
          </button>
        </div>
      `;
    }

    function checkCharacterAnswer(selected, correct) {
      const feedback = document.getElementById('char-quiz-feedback');
      const nextBtn = document.getElementById('next-to-wisdom-btn');
      
      feedback.classList.remove('hidden', 'bg-red-100', 'text-red-700', 'bg-green-100', 'text-green-700');

      if (selected === correct) {
        feedback.classList.add('bg-green-100', 'text-green-700');
        feedback.innerHTML = '✨ ذاكرتك حديدية! إجابة صحيحة.';
        nextBtn.classList.remove('hidden');
      } else {
        feedback.classList.add('bg-red-100', 'text-red-700');
        feedback.innerHTML = '🤔 لا، حاول أن تتذكر جيداً!';
      }
    }

    // --- 3. شاشة بطاقة الحكمة الختامية ---
    function showWisdomKeepsake() {
      userProgress[currentStory.story_id] = { status: 'finished' };
      localStorage.setItem('story_progress', JSON.stringify(userProgress));

      const container = document.getElementById('reader-content');
      container.innerHTML = `
        <div class="space-y-6">
          <h2 class="text-3xl font-black text-green-600">🏆 بطاقة الحكمة الذكية</h2>
          <div class="border-4 border-amber-400 p-4 rounded-3xl bg-amber-50 shadow-inner">
            <img src="stories/${currentStory.folder}/${currentStory.wisdom_keepsake.image_filename}?v=${Date.now()}" class="max-h-[45vh] w-auto mx-auto object-contain rounded-2xl mb-4 shadow-sm" onerror="this.src='https://via.placeholder.com/500x300?text=لوحة+الحكمة'">
            <p class="text-2xl font-black text-amber-900">"${currentStory.wisdom_keepsake.quote_ar}"</p>
          </div>
          <button onclick="closeReader(); loadStories();" class="bg-amber-600 hover:bg-amber-700 text-white px-8 py-3 rounded-2xl font-bold text-lg transition transform hover:scale-105">العودة للمكتبة 📚</button>
        </div>
      `;
    }

    function closeReader() {
      document.getElementById('reader-modal').classList.add('hidden');
      loadStories();
    }

    loadStories();
  </script>
</body>
</html>
