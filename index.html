  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n]};
const raEq=(a,b)=>{if(a===b)return true;const L=Math.max(a.length,b.length);return L>2&&raLev(a,b)<=(L<=4?1:L<=7?2:3)};
function raAlign(W,heard){const hit=new Set();let p=0;
  for(const h of heard)for(let j=p;j<Math.min(W.length,p+5);j++)if(raEq(W[j],h)){hit.add(j);p=j+1;break}
  return hit}
function raWords(text){
  if(!raOK())return esc(text);let k=0;
  return String(text).split(/(\s+)/).map(p=>/^\s+$/.test(p)||!raN(p)?esc(p):`<span class="rw" data-k="${k++}">${esc(p)}</span>`).join('')}
const raBar=()=>{if(!raOK())return'';const m=raMode(),
  b=m==='record'?`<button class="btn or" id="rabtn" data-k="rec">${t('raRecBtn')}</button>`
   :m==='choice'?`<button class="btn or" id="rabtn" data-k="star">${t('raStarBtn')}</button><button class="btn" id="rabtn2" data-k="rec">${t('raRecBtn')}</button>`
   :`<button class="btn or" id="rabtn" data-k="star">${t('raBtn')}</button>`;
  return `<div class="rabar" id="rabar">${b}<span class="rastar" id="rastar">${raStarred()?'⭐':''}</span><div class="ramsg" id="ramsg"></div><div id="raplay"></div></div>`};
/* ----- playback of the child's own recording, words light up in time ----- */
function raPlayStop(){
  if(RP){cancelAnimationFrame(RP.raf);try{RP.a.pause()}catch(_){}RP=null}
  const b=$('#raplb');if(b)b.textContent=t('raPlay')}
function raTimes(rec,W){ // start time (seconds) of every word
  const n=W.length,d=rec.dur||3,kn=rec.times||{},ks=Object.keys(kn).map(Number).filter(k=>k<n);
  if(ks.length>=2){ // recognized times (minus recognition lag), gaps filled by interpolation
    const kt=new Array(n).fill(null),out=new Array(n);ks.forEach(k=>kt[k]=Math.max(0,kn[k]-.6));
    for(let i=0;i<n;i++){
      if(kt[i]!==null){out[i]=kt[i];continue}
      let p=i-1;while(p>=0&&kt[p]===null)p--;let q=i+1;while(q<n&&kt[q]===null)q++;
      const tp=p>=0?kt[p]:0,tq=q<n?kt[q]:d,ip=p>=0?p:-1,iq=q<n?q:n;
      out[i]=tp+(tq-tp)*(i-ip)/(iq-ip)}
    for(let i=1;i<n;i++)out[i]=Math.max(out[i],out[i-1]);
    return out}
  const w=W.map(x=>x.length+1),tot=w.reduce((a,b)=>a+b,0);let acc=0; // no timestamps: spread by word length
  return W.map((_,i)=>{const s=d*.9*acc/tot+d*.05;acc+=w[i];return s})}
function raPlay(rec){
  if(RP)return raPlayStop();
  const els=[...document.querySelectorAll('#rtext .rw')],tm=raTimes(rec,els.map(e=>raN(e.textContent))),a=new Audio(rec.url);
  els.forEach(e=>e.classList.remove('hit','cur'));RP={a,raf:0};$('#raplb').textContent=t('raPause');
  const tick=()=>{if(!RP||RP.a!==a)return;const c=a.currentTime;els.forEach((e,k)=>e.classList.toggle('hit',tm[k]<=c));RP.raf=requestAnimationFrame(tick)};
  a.onended=()=>{els.forEach(e=>e.classList.add('hit'));raPlayStop()};
  a.play().then(()=>{if(RP&&RP.a===a)tick()}).catch(()=>raPlayStop())}
function raShowPlay(){
  const rec=RR[raKey()],box=$('#raplay');if(!box)return;
  if(!rec){box.innerHTML='';return}
  box.innerHTML=`<button class="btn" id="raplb">${t('raPlay')}</button><button class="btn ghost" id="radl">${t('raDl')}</button><div class="ramut">${t('raKeep')}</div>`;
  $('#raplb').onclick=()=>raPlay(rec);$('#radl').onclick=e=>raDownload(rec,e.currentTarget)}
function raFree(){raPlayStop();Object.values(RR).forEach(r=>URL.revokeObjectURL(r.url));RR={}}
async function raWav(blob){ // WebM/M4A -> mono 16-bit WAV so it opens everywhere
  const ctx=new(window.AudioContext||window.webkitAudioContext)();
  try{
    const ab=await blob.arrayBuffer(),buf=await new Promise((ok,no)=>ctx.decodeAudioData(ab,ok,no)),
      n=buf.length,ch=buf.numberOfChannels,sr=buf.sampleRate,mono=new Float32Array(n);
    for(let c=0;c<ch;c++){const d=buf.getChannelData(c);for(let i=0;i<n;i++)mono[i]+=d[i]/ch}
    const o=new DataView(new ArrayBuffer(44+n*2)),w=(p,s)=>{for(let i=0;i<s.length;i++)o.setUint8(p+i,s.charCodeAt(i))};
    w(0,'RIFF');o.setUint32(4,36+n*2,true);w(8,'WAVE');w(12,'fmt ');o.setUint32(16,16,true);o.setUint16(20,1,true);o.setUint16(22,1,true);
    o.setUint32(24,sr,true);o.setUint32(28,sr*2,true);o.setUint16(32,2,true);o.setUint16(34,16,true);w(36,'data');o.setUint32(40,n*2,true);
    for(let i=0;i<n;i++){const s=Math.max(-1,Math.min(1,mono[i]));o.setInt16(44+i*2,s<0?s*0x8000:s*0x7FFF,true)}
    return new Blob([o],{type:'audio/wav'})
  }finally{ctx.close&&ctx.close()}}
async function raDownload(rec,btn){
  const old=btn.textContent;btn.disabled=true;btn.textContent=t('raDling');
  let blob=rec.blob,name='kessa-page-'+rec.page;
  try{blob=await raWav(rec.blob);name+='.wav'}catch(_){name+=/mp4|aac/.test(rec.blob.type)?'.m4a':'.webm'}
  btn.disabled=false;btn.textContent=old;
  const f=new File([blob],name,{type:blob.type});
  if(raIOS&&navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f]});return}catch(e){if(e.name==='AbortError')return}}
  const u=URL.createObjectURL(f),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),8000)}
/* ----- one reading session per page ----- */
function raStop(){
  raPlayStop();
  if(RA){clearTimeout(RA.tm);RA.on=false;try{RA.rec&&RA.rec.abort()}catch(_){}try{if(RA.mr&&RA.mr.state!=='inactive'){RA.mr.onstop=null;RA.mr.stop()}}catch(_){}RA.stream&&RA.stream.getTracks().forEach(x=>x.stop())}
  RA=null}
function raInit(){
  if(!raOK()||!$('#rabtn'))return;
  const mode=raMode(),both=mode==='both';
  const me=RA={W:[...document.querySelectorAll('#rtext .rw')].map(e=>raN(e.textContent)),hits:new Set(),times:{},kind:'',useSR:false,useRec:false,on:false,fin:false,base:[],sess:[],errs:0,restarts:0,rec:null,err:'',fatal:'',tm:0,mr:null,stream:null,chunks:[],t0:0,dur:0,recP:null};
  if(!me.W.length){$('#rabar').hidden=true;return}
  const msg=h=>{if(RA===me)$('#ramsg').innerHTML=h};
  const btns=()=>[$('#rabtn'),$('#rabtn2')].filter(Boolean);
  const label=b=>t(b.dataset.k==='rec'?'raRecBtn':mode==='choice'?'raStarBtn':'raBtn');
  const idle=()=>btns().forEach(b=>{b.hidden=false;b.textContent=label(b)});
  const busy=b=>btns().forEach(x=>{x.hidden=x!==b;if(x===b)x.textContent=t('raStop')});
  const paint=()=>{let cur=-1;me.hits.forEach(k=>{if(k>cur)cur=k});
    document.querySelectorAll('#rtext .rw').forEach((e,k)=>{e.classList.toggle('hit',me.hits.has(k));e.classList.toggle('cur',me.on&&k===cur+1)})};
  const stopRec=()=>new Promise(res=>{
    const mr=me.mr,done=()=>{me.stream&&me.stream.getTracks().forEach(x=>x.stop());me.stream=null;res(new Blob(me.chunks,{type:(mr&&mr.mimeType)||'audio/webm'}))};
    if(mr&&mr.state!=='inactive'){mr.onstop=done;try{mr.stop()}catch(_){done()}}else done()});
  async function startRec(){
    me.chunks=[];
    const st=await navigator.mediaDevices.getUserMedia({audio:true});
    if(RA!==me||!me.on){st.getTracks().forEach(x=>x.stop());return}
    me.stream=st;
    try{me.mr=new MediaRecorder(st);me.mr.ondataavailable=e=>{if(e.data.size)me.chunks.push(e.data)};me.mr.start(1000);me.t0=Date.now()}
    catch(e){me.mr=null;if(!me.useSR)throw e}}
  function evaluate(){
    if(me.fin||RA!==me)return;me.fin=true;
    const f=S.story.folder,rk=raKey(),key=f+'|'+rk,pg=S.i+1,
      need=Math.max(1,Math.ceil(me.W.length*(AGES[S.story.age_group]?.pass||.66))),passed=me.useSR&&!me.err&&me.hits.size>=need;
    const saved=me.useRec?(me.recP||Promise.resolve(new Blob())).then(b=>{
      if(RA!==me||!b.size)return false;
      const old=RR[rk];if(old)URL.revokeObjectURL(old.url);
      RR[rk]={blob:b,url:URL.createObjectURL(b),dur:me.dur,times:me.times,page:pg};return true}):Promise.resolve(false);
    const after=()=>saved.then(()=>{if(RA===me)raShowPlay()});
    if(!me.useSR)return void saved.then(ok=>{
      if(RA!==me)return;
      msg(ok?`<p class="raok">${t('raRecDone')}</p>`:`<p>${t('raNoRec')}</p>`);raShowPlay()});
    if(me.err){msg(`<p>${t(me.err)}</p>`);return after()}
    if(passed){(RS[f]=RS[f]||{})[rk]=1;localStorage.setItem('kessa_stars_v1',JSON.stringify(RS));
      $('#rastar').textContent='⭐';
      msg(`<p class="raok">${t('raPass')}</p>${mode==='choice'?`<p class="ramut">${t('raHear')}</p>`:''}`);return after()}
    const n=RAT[key]=(RAT[key]||0)+1;
    msg(`<p>${t(n>=2?'raFail2':'raFail')}</p><button class="btn" id="rar">${t('raRetry')}</button>${n>=2?`<button class="btn ghost" id="rac">${t('raCont')}</button>`:''}`);
    $('#rar').onclick=()=>{msg('');begin(me.kind)};if(n>=2)$('#rac').onclick=()=>next();
    after()}
  function finish(err){
    if(!me.on)return;me.on=false;if(err)me.err=err;clearTimeout(me.tm);me.dur=Math.round((Date.now()-(me.t0||Date.now()))/100)/10;
    idle();paint();me.recP=me.useRec?stopRec():null;
    if(!me.useSR)return evaluate();
    try{me.rec.stop()}catch(_){}
    if(err)evaluate();else setTimeout(()=>{if(RA===me)evaluate()},1500)}
  function start(){
    const rec=me.rec=new raSR();rec.lang=RL[lang]||'en-US';rec.continuous=true;rec.interimResults=true;rec.maxAlternatives=1;
    rec.onresult=e=>{
      if(RA!==me||me.rec!==rec)return;
      const pre=(a,b)=>a.every((w,j)=>b[j]===w),segs=[];
      for(let i=0;i<e.results.length;i++){
        const tk=e.results[i][0].transcript.split(/\s+/).map(raN).filter(Boolean);if(!tk.length)continue;
        const last=segs[segs.length-1];
        if(last&&(pre(last,tk)||(last.length>=2&&pre(last.slice(0,-1),tk))))segs[segs.length-1]=tk;else segs.push(tk)}
      me.sess=segs.flat();
      raAlign(me.W,me.base.concat(me.sess)).forEach(k=>{if(!me.hits.has(k)){me.hits.add(k);me.times[k]=(Date.now()-me.t0)/1000}});
      paint();
      if(me.hits.has(me.W.length-1))setTimeout(()=>{if(RA===me)finish()},700)};
    rec.onerror=e=>{
      if(RA!==me)return;const c=e.error;
      if(c==='no-speech'||c==='aborted')return;
      if(c==='not-allowed'||c==='service-not-allowed'||c==='audio-capture')me.fatal='raDenied';
      else if(c!=='network'||++me.errs>2)me.fatal='raNet'};
    rec.onend=()=>{
      if(RA!==me||me.rec!==rec)return;
      me.base=me.base.concat(me.sess);me.sess=[];
      if(me.fatal)return finish(me.fatal);
      if(me.on){
        if(me.restarts++<25)setTimeout(()=>{if(RA===me&&me.on)try{start()}catch(_){finish('raNet')}},150);else finish()
      }else evaluate()};
    rec.start()}
  async function begin(kind){
    const b=btns().find(x=>x.dataset.k===kind)||btns()[0];
    raPlayStop();$('#raplay').innerHTML='';
    Object.assign(me,{kind,useSR:kind==='star',useRec:kind==='rec'||both,hits:new Set(),times:{},base:[],sess:[],errs:0,restarts:0,fin:false,err:'',fatal:'',on:true,mr:null,chunks:[],t0:Date.now(),recP:null});
    paint();busy(b);msg(`<span>${t(me.useSR?'raListen':'raRecListen')}</span>`);
    clearTimeout(me.tm);me.tm=setTimeout(()=>{if(RA===me)finish()},120000);
    if(me.useRec){
      try{await startRec()}
      catch(_){if(RA===me){me.on=false;clearTimeout(me.tm);idle();msg(`<p>${t('raDenied')}</p>`)}return}}
    if(RA!==me||!me.on)return;
    if(me.useSR){
      if(me.useRec)await new Promise(r=>setTimeout(r,300)); // recorder first, recognition 300 ms later
      if(RA===me&&me.on)try{start()}catch(_){finish('raNet')}}}
  function consent(b){
    msg(`<div class="racon"><p>${t({both:'raCB',choice:'raCC',record:'raCR',stars:'raCS'}[mode])}</p><button class="btn" id="ray">${t('raYes')}</button><button class="btn ghost" id="ran">${t('raNo')}</button></div>`);
    $('#ray').onclick=()=>{localStorage.setItem('kessa_ra_v3','1');msg('');begin(b.dataset.k)};$('#ran').onclick=()=>msg('')}
  $('#rabar').onclick=e=>e.stopPropagation();
  btns().forEach(b=>b.onclick=()=>{if(me.on)finish();else if(localStorage.getItem('kessa_ra_v3')==='1')begin(b.dataset.k);else consent(b)});
  raShowPlay()}
LANGS[lang]?showLibrary():showLang();
</script>
