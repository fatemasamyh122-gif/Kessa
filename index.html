  const steps=[];

  let tok=0;const ok=new Set(),credit=k=>{ok.add(k);const ai=steps[k].ai;if(steps.every((s,j)=>s.ai!==ai||ok.has(j)))addWin(S.story.folder+'#'+ai)};
  const go=(k,dir)=>{

    const{a,ai,f}=steps[k];CUR=a;S.tb=true;

const AR='ابتثجحخدذرزسشصضطظعغفقكلمنهوي',EN='ABCDEFGHIJKLMNOPQRSTUVWXYZ';

const slideStep=done=>{
  const c=AC(),n=Math.min(3,Math.max(2,+c.size||3)),N=n*n;if(!c.image)return done();nav(false);
  let b,e;
  do{b=[...Array(N).keys()];e=N-1;
    for(let k=0;k<N*2;k++){const r=e/n|0,q=e%n,m=[];if(r>0)m.push(e-n);if(r<n-1)m.push(e+n);if(q>0)m.push(e-1);if(q<n-1)m.push(e+1);const j=m[Math.random()*m.length|0];[b[e],b[j]]=[b[j],b[e]];e=j}
  }while(b.every((v,i)=>v===i)); // gentle shuffle: a few slides away from solved
  const order=['ctx','tip1','tip2','tip3','tip4','tip5'];let ti=0,tip=t('tip0'),showOk=false;
  const ctx=()=>{for(let r=0;r<n;r++)if(!b.slice(r*n,r*n+n).every((v,i)=>v===r*n+i))return t('tipRow').replace('{n}',r+1);return t('tip0')};

     ${solved?'':`<div class="shint"><div class="sprevw"><img class="sprev" src="${asset(c.image)}" alt=""><small>${t('goalpic')}</small></div><div class="stip"><div class="tipbox" id="tipbox">${esc(tip)}</div><button class="btn ghost sm" id="tipb">${t('tipBtn')}</button><button class="btn ghost sm" id="okb">${showOk?'✓ ':''}${t('okBtn')}</button></div></div>`}
     <div class="sl" style="grid-template-columns:repeat(${n},1fr)">${b.map((v,i)=>v===N-1&&!solved?'<div class="tile e"></div>':`<button class="tile${showOk&&v===i&&!solved?' ok':''}" data-i="${i}" style="background-image:url('${asset(c.image)}');background-size:${n*100}% ${n*100}%;background-position:${(v%n)*100/(n-1)}% ${(v/n|0)*100/(n-1)}%"></button>`).join('')}</div>
     ${solved?`<div class="fb">${goBtn(t('slideOk'))}</div>`:''}`);
    if(solved)return void($('#go').onclick=done);
    $('#tipb').onclick=()=>{const k=order[ti++%order.length];tip=k==='ctx'?ctx():t(k);$('#tipbox').textContent=tip};
    $('#okb').onclick=()=>{showOk=!showOk;draw()};

const cwStep=done=>{
  const ws=(AC().words||[]).map(x=>({...x,w:[...String(x.word).replace(/\s/g,'')].map(norm)})).filter(x=>x.w.length>1).sort((a,b)=>b.w.length-a.w.length).slice(0,6);
  if(ws.length<2)return done();nav(false);
  const M=new Map(),K=(r,c)=>r+','+c,get=(r,c)=>M.get(K(r,c)),placed=[];
  const fits=(w,r,c,dr,dc)=>{
    if(get(r-dr,c-dc)||get(r+dr*w.length,c+dc*w.length))return false;let cross=0;
    for(let i=0;i<w.length;i++){const y=r+dr*i,x=c+dc*i,v=get(y,x);
      if(v){if(v.ch!==w[i]||(v.d&(dr?2:1)))return false;cross++}else if(get(y+dc,x+dr)||get(y-dc,x-dr))return false}
    return cross>0};
  const put=(x,r,c,dr,dc)=>{x.w.forEach((ch,i)=>{const y=r+dr*i,z=c+dc*i,v=get(y,z);M.set(K(y,z),{ch,d:(v?v.d:0)|(dr?2:1)})});Object.assign(x,{r,c,dr});placed.push(x)};
  put(ws[0],0,0,0,1);
  ws.slice(1).forEach(x=>{outer:for(const[dr,dc]of[[1,0],[0,1]])for(const[kk,v]of M){const[y,z]=kk.split(',').map(Number);
    for(let i=0;i<x.w.length;i++)if(x.w[i]===v.ch){const r=y-dr*i,c=z-dc*i;if(fits(x.w,r,c,dr,dc)){put(x,r,c,dr,dc);break outer}}}});
  if(placed.length<2)return done();
  const ks=[...M.keys()].map(s=>s.split(',').map(Number)),r0=Math.min(...ks.map(a=>a[0])),c0=Math.min(...ks.map(a=>a[1])),
    R=Math.max(...ks.map(a=>a[0]))-r0+1,C=Math.max(...ks.map(a=>a[1]))-c0+1,nums={};let nn=0;
  [...placed].sort((a,b)=>a.r-b.r||a.c-b.c).forEach(x=>{const k=K(x.r,x.c);if(!nums[k])nums[k]=++nn;x.n=nums[k]});
  let cellsH='';for(let r=0;r<R;r++)for(let c=0;c<C;c++){const v=get(r+r0,c+c0);
    cellsH+=v?`<div class="xc"><sup>${nums[K(r+r0,c+c0)]||''}</sup><input maxlength="1" data-a="${esc(v.ch)}" autocomplete="off" autocapitalize="characters"></div>`:'<div class="xc"></div>'}
  const list=(f,title)=>{const a=placed.filter(f).sort((a,b)=>a.n-b.n);return a.length?`<div class="xcl"><b>${title}</b><br>${a.map(x=>`${x.n}. ${esc(x.clue_ar||'')}`).join('<br>')}</div>`:''};
  stage(`<span class="chip">${t('cw')}</span><p class="fb">${t('cwH')}</p>
   <div class="xw" style="grid-template-columns:repeat(${C},minmax(0,1fr));width:min(${C*46}px,100%);direction:${lang==='en'?'ltr':'rtl'}">${cellsH}</div>${list(x=>!x.dr,t('ac'))}${list(x=>x.dr,t('dn'))}
   <div class="fb" id="fb"></div><button class="btn gr" id="chk">${t('chk')}</button>`);
  $('#chk').onclick=()=>{
    let bad=0;document.querySelectorAll('.xc input').forEach(i=>{const ok=norm(i.value.trim())===i.dataset.a;i.classList.toggle('bad',!ok);if(!ok)bad++});
    if(bad)$('#fb').textContent=t('cwBad');else{$('#chk').hidden=true;FIN(t('cwOk'),done)}
  };
};

    addEventListener('pointermove',mv);addEventListener('pointerup',up);addEventListener('pointercancel',up);
  });
};

/* ---------- wisdom card: numbered, downloadable ---------- */
function finishStory(){
  const id=S.story.folder;if(progress[id]?.n)return progress[id].n;
  const b=lvl('read',counts(lang).read);
  const n=Object.values(progress).filter(p=>p.n&&p.lang===lang).length+1;progress[id]={status:'finished',n,lang};save();rankToast('read',b);return n;
}
function rr(x,a,b,w,h,r){x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath()}
function wrap(x,text,maxW){const out=[];let line='';for(const w of String(text).split(/\s+/)){const s=line?line+' '+w:w;if(x.measureText(s).width>maxW&&line){out.push(line);line=w}else line=s}out.push(line);return out}
async function makeCard(n,useImg=true){
  const W=1240,H=1754,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d'),F='"Readex Pro",Cairo,sans-serif'; // A4 ratio
  try{await document.fonts.load(`700 40px ${F}`)}catch(e){}
  const g=x.createLinearGradient(0,0,W,H);g.addColorStop(0,'#e7e1ff');g.addColorStop(1,'#ffe9cf');x.fillStyle=g;x.fillRect(0,0,W,H);
  const w=S.story.wisdom_keepsake||{};
  if(useImg&&w.image_filename){try{
    const im=await new Promise((r,j)=>{const i=new Image();i.onload=()=>r(i);i.onerror=j;i.src=asset(w.image_filename)});
    const k=Math.min(W/im.width,H/im.height); // whole image, never cropped
    x.drawImage(im,(W-im.width*k)/2,(H-im.height*k)/2,im.width*k,im.height*k)}catch(e){}}
  x.direction=lang==='en'?'ltr':'rtl';x.textAlign='center';x.textBaseline='middle';
  // numbered badge (sits in the image's empty top area)
  const badge=t('badge').replace('{n}',n);x.font=`700 58px ${F}`;
  const bw=x.measureText(badge).width+100,bh=100;
  x.shadowColor='rgba(0,0,0,.22)';x.shadowBlur=20;x.fillStyle='#fff';rr(x,(W-bw)/2,60,bw,bh,50);x.fill();x.shadowBlur=0;
  x.lineWidth=5;x.strokeStyle='#d97706';x.stroke();x.fillStyle='#5b4bdb';x.fillText(badge,W/2,60+bh/2+3);
  // slim quote strip
  x.font=`600 40px ${F}`;const lines=wrap(x,w.quote_ar||S.story.moral_ar,960),lh=60,ph=lines.length*lh+96,py=H-ph-44;
  x.fillStyle='rgba(255,255,255,.9)';rr(x,70,py,W-140,ph,36);x.fill();
  x.fillStyle='#1f1b4d';lines.forEach((l,i)=>x.fillText(l,W/2,py+38+lh/2+i*lh));
  x.font=`600 24px ${F}`;x.fillStyle='#8a86ad';x.fillText('قصة · A Story',W/2,py+ph-28);
  try{return c.toDataURL('image/png')}catch(e){return useImg?makeCard(n,false):''}
}

/* ---------- SPIKE: record + recognize together (temporary, delete after testing) ---------- */
(()=>{
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  let rec=null,mr=null,stream=null,chunks=[],active=false,restarts=0,results=0,t0=performance.now(),url=null,base='',sess='',fatal=false;
  const log=m=>{$('#spk-log').textContent=((performance.now()-t0)/1000).toFixed(1)+'s  '+m+'\n'+$('#spk-log').textContent};

  $('#spk-open').onclick=()=>{
    $('#spk').classList.add('on');
    $('#spk-env').textContent=['SpeechRecognition: '+(SR?'yes':'NO'),'MediaRecorder: '+(window.MediaRecorder?'yes':'NO'),
      'Secure context: '+window.isSecureContext,'Online: '+navigator.onLine,navigator.userAgent].join('\n');
  };
  $('#spk-x').onclick=()=>{stop();$('#spk').classList.remove('on')};

  const startRec=()=>{
    if(!window.MediaRecorder)return log('no MediaRecorder');
    try{
      mr=new MediaRecorder(stream);
      mr.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
      mr.onstart=()=>log('recorder started ('+mr.mimeType+')');
      mr.onerror=e=>log('recorder ERROR '+(e.error&&e.error.name));
      mr.start(1000);
    }catch(e){log('recorder FAILED: '+e.message)}
  };

  const startSR=()=>{
    if(!SR)return log('no SpeechRecognition');
    rec=new SR();rec.lang=$('#spk-lang').value;rec.continuous=true;rec.interimResults=true;rec.maxAlternatives=1;
    rec.onstart=()=>log('recognition started');
    rec.onaudiostart=()=>log('recognition is receiving audio');
    rec.onresult=e=>{
      let f='',i2='';
      for(let i=0;i<e.results.length;i++){const r=e.results[i];if(r.isFinal)f+=r[0].transcript+' ';else i2+=r[0].transcript}
      sess=f;results++;$('#spk-final').textContent=base+f;$('#spk-interim').textContent=i2;
    };
    rec.onerror=e=>{log('recognition ERROR: '+e.error);if(['not-allowed','service-not-allowed','network','language-not-supported'].includes(e.error))fatal=true};
    rec.onend=()=>{
      log('recognition ended');base+=sess;sess='';
      if(active&&!fatal&&restarts<20){restarts++;log('auto-restart #'+restarts);try{startSR()}catch(_){}}
    };
    try{rec.start()}catch(e){log('recognition start FAILED: '+e.message)}
  };

  async function start(){
    if(active)return;
    ['#spk-log','#spk-final','#spk-interim','#spk-audio'].forEach(s=>{$(s).textContent=''});
    $('#spk-audio').innerHTML='';t0=performance.now();chunks=[];restarts=0;results=0;base='';sess='';fatal=false;
        const ord=$('#spk-ord').value;
    if(ord!=='sronly'){
      try{stream=await navigator.mediaDevices.getUserMedia({audio:true});log('mic permission granted')}
      catch(e){return log('mic FAILED: '+e.name)}
    }
    active=true;$('#spk-go').textContent='⏹ Stop';
    if(ord==='sronly')startSR();
    else if(ord==='rec'){startRec();setTimeout(startSR,300)}else{startSR();setTimeout(startRec,300)}
  }
  function finish(){
    stream&&stream.getTracks().forEach(t=>t.stop());
    const size=chunks.reduce((a,c)=>a+c.size,0);
    log('DONE: recorded '+Math.round(size/1024)+' KB, '+results+' recognition results, '+restarts+' restarts');
    if(size){
      if(url)URL.revokeObjectURL(url);
      url=URL.createObjectURL(new Blob(chunks,{type:(mr&&mr.mimeType)||'audio/webm'}));
      $('#spk-audio').innerHTML='<audio controls src="'+url+'"></audio>';
    }
  }
  function stop(){
    if(!active)return;active=false;$('#spk-go').textContent='🎙 Start';
    try{rec&&rec.stop()}catch(_){}
    if(mr&&mr.state!=='inactive'){mr.onstop=finish;mr.stop()}else finish();
  }
  $('#spk-go').onclick=()=>active?stop():start();
})();
